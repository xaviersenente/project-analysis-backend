services:
  - type: web
    name: project-analysis
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Valeurs à saisir dans le tableau de bord de Render (S2)
      - key: API_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
