<!DOCTYPE html>
<html lang="fr">
  <head>

    <meta name="description" content="Le studio Piège conçoit des sites pour les associations.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/texte.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="entete">
      <button class="burger" type="button" popovertarget="menu" aria-label="Menu">

    <main class="contenu">

    <footer class="pied">
      <p class="pied__texte"><a href="mailto:bonjour@piege.test">bonjour@piege.test</a></p>
